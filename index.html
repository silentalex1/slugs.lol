<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Incoming</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #121317;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .countdown-card {
            background-color: #1a1c22;
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 48px 64px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .countdown-card h1 {
            font-size: 26px;
            font-weight: 600;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .countdown-card p {
            color: #8a8d98;
            font-size: 14px;
            margin-bottom: 32px;
        }

        .timer-container {
            display: flex;
            gap: 16px;
            justify-content: center;
        }

        .time-box {
            background-color: #13141a;
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            width: 88px;
            height: 96px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
        }

        .time-box .number {
            font-size: 40px;
            font-weight: 700;
            color: #d8e0ff;
            line-height: 1.1;
            margin-bottom: 4px;
        }

        .time-box .label {
            font-size: 10px;
            font-weight: 600;
            color: #71747e;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <div class="countdown-card">
        <h1>Update Incoming</h1>
        <p>for the next release update of slugs.lol</p>
        
        <div class="timer-container">
            <div class="time-box">
                <span class="number" id="hours">23</span>
                <span class="label">HOURS</span>
            </div>
            <div class="time-box">
                <span class="number" id="minutes">59</span>
                <span class="label">MINUTES</span>
            </div>
            <div class="time-box">
                <span class="number" id="seconds">47</span>
                <span class="label">SECONDS</span>
            </div>
        </div>
    </div>

    <script>
        let totalSeconds = (23 * 3600) + (59 * 60) + 47;

        const hoursElement = document.getElementById('hours');
        const minutesElement = document.getElementById('minutes');
        const secondsElement = document.getElementById('seconds');

        function padNumber(num) {
            return num.toString().padStart(2, '0');
        }

        const countdownTimer = setInterval(() => {
            if (totalSeconds <= 0) {
                clearInterval(countdownTimer);
                return;
            }
            
            totalSeconds--;

            const currentHours = Math.floor(totalSeconds / 3600);
            const currentMinutes = Math.floor((totalSeconds % 3600) / 60);
            const currentSeconds = totalSeconds % 60;

            hoursElement.textContent = padNumber(currentHours);
            minutesElement.textContent = padNumber(currentMinutes);
            secondsElement.textContent = padNumber(currentSeconds);
            
        }, 1000);
    </script>
</body>
</html>
